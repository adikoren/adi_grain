services:
  app:
    build: .
    ports:
      - "3000:3000"
    # Copy .env.docker.example → .env.docker and fill in NEXTAUTH_SECRET + NEXTAUTH_URL
    env_file:
      - .env.docker
    environment:
      # Always use the Docker volume path regardless of what's in .env.docker
      DATABASE_URL: "file:/data/grain.db"
      NODE_ENV: "production"
    volumes:
      - grain_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  grain_data:
    driver: local
